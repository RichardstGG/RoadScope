name: mobile

on:
  pull_request:
    paths:
      - .github/workflows/mobile.yml
      - apps/mobile/**
      - packages/**
      - docs/mobile-toolchain.md
      - contracts/location-log/**
      - testdata/contracts/location-log/**
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile.yml
      - apps/mobile/**
      - packages/**
      - docs/mobile-toolchain.md
      - contracts/location-log/**
      - testdata/contracts/location-log/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter pub get
        working-directory: packages/mobile_data
      - run: flutter analyze
        working-directory: packages/mobile_data
      - run: flutter test
        working-directory: packages/mobile_data
      - run: flutter pub get
        working-directory: packages/device_bridge
      - run: flutter analyze
        working-directory: packages/device_bridge
      - run: flutter test
        working-directory: packages/device_bridge
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: flutter build apk --debug
        working-directory: apps/mobile
      - run: ./gradlew :device_bridge:testDebugUnitTest --console=plain
        working-directory: apps/mobile/android
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix contracts/tools
      - run: node contracts/tools/validate-location-log.mjs apps/mobile/build/device_bridge/native-log-fixtures/*.ndjson
      # Pending contract PR #10: pin the reviewed schema, not its moving branch.
      - uses: actions/checkout@v7
        with:
          ref: 747493332c2dd59044a425508387b3b4d31ab24e
          path: motion-contract
      - run: npm ci --prefix motion-contract/contracts/tools
      - run: node motion-contract/contracts/tools/validate-motion-lean.mjs apps/mobile/build/device_bridge/native-motion-fixtures/*.ndjson
      - name: Validate native lean and raw pairs
        run: |
          for motion in apps/mobile/build/device_bridge/native-lean-fixtures/*.motion.ndjson; do
            node motion-contract/contracts/tools/validate-motion-lean.mjs "$motion"
            node motion-contract/contracts/tools/validate-motion-lean.mjs --motion "$motion" "${motion%.motion.ndjson}.lean.ndjson"
          done
      # Diagnostics telemetry is a separate format with its own reader; running
      # it here keeps the Kotlin writer and the Dart reader aligned.
      - run: dart run bin/inspect_telemetry.dart --strict ../../apps/mobile/build/device_bridge/native-telemetry-fixtures/*.ndjson
        working-directory: packages/device_bridge

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build ios --no-codesign
        working-directory: apps/mobile
