name: mobile

on:
  pull_request:
    paths:
      - .github/workflows/mobile.yml
      - apps/mobile/**
      - packages/**
      - docs/mobile-toolchain.md
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile.yml
      - apps/mobile/**
      - packages/**
      - docs/mobile-toolchain.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: flutter build apk --debug
        working-directory: apps/mobile

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build ios --no-codesign
        working-directory: apps/mobile
