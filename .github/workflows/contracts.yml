name: contracts

on:
  pull_request:
    paths:
      - .github/workflows/contracts.yml
      - contracts/**
      - testdata/contracts/**
  push:
    branches: [main]
    paths:
      - .github/workflows/contracts.yml
      - contracts/**
      - testdata/contracts/**
  workflow_dispatch:
    inputs:
      large:
        description: 'Also run the 2 GiB capacity acceptance (about an hour)'
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * 1' # weekly capacity acceptance

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contracts/tools/package-lock.json
      - run: npm ci
        working-directory: contracts/tools
      # Every fixture must land on the side it belongs to.
      - run: npm test
        working-directory: contracts/tools
      # The CLI is what Codex and the handoff report will actually run, so keep
      # it exercised separately from the library-level fixture runner.
      - name: validate valid fixtures
        run: node validate-location-log.mjs ../../testdata/contracts/location-log/v1/valid/*.ndjson
        working-directory: contracts/tools
      - name: validate valid motion/lean fixtures
        run: |
          node validate-motion-lean.mjs ../../testdata/contracts/motion-lean/v1/motion/valid/*.ndjson
          node validate-motion-lean.mjs ../../testdata/contracts/motion-lean/v1/lean/valid/*.ndjson
          for dir in ../../testdata/contracts/motion-lean/v1/pairs/valid/*/; do
            node validate-motion-lean.mjs --motion "$dir/motion.ndjson" "$dir/motion.ndjson" "$dir/lean.ndjson"
          done
        working-directory: contracts/tools
      - name: validate valid v2 motion/lean fixtures
        run: |
          node validate-motion-lean.mjs ../../testdata/contracts/motion-lean/v2/motion/valid/*.ndjson
          node validate-motion-lean.mjs ../../testdata/contracts/motion-lean/v2/lean/valid/*.ndjson
          for dir in ../../testdata/contracts/motion-lean/v2/pairs/valid/*/; do
            node validate-motion-lean.mjs --motion "$dir/motion.ndjson" "$dir/motion.ndjson" "$dir/lean.ndjson"
          done
          for dir in ../../testdata/contracts/motion-lean/v2/runs/valid/*/; do
            node validate-motion-lean.mjs --parent "$dir/parent.ndjson" "$dir/lean.ndjson"
          done
        working-directory: contracts/tools
      # exit 4: the tool must refuse an unsupported schemaVersion instead of reporting PASS.
      - name: unsupported schemaVersion is not a pass
        run: |
          set +e
          node validate-motion-lean.mjs ../../testdata/contracts/motion-lean/v2/motion/invalid/02-unsupported-schema-version.ndjson
          test $? -eq 4
        working-directory: contracts/tools

  # C2 capacity acceptance (0003 E.5): 2 GiB synthetic inputs per profile, peak RSS <= 256 MiB, every run
  # completed. Not a per-PR gate (about an hour); weekly and on demand. A watchdog abort is a failure.
  large:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.large)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contracts/tools/package-lock.json
      - run: npm ci
        working-directory: contracts/tools
      - name: 2 GiB synthetic profiles
        run: node test/run-large.mjs --bytes 2147483648 --dir "$RUNNER_TEMP/large" --clean-inputs | tee "$RUNNER_TEMP/large-report.txt"
        working-directory: contracts/tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-validation-report
          path: ${{ runner.temp }}/large-report.txt

